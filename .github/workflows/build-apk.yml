name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Build Web App
        run: |
          npm install --legacy-peer-deps || true

      - name: Packaging Info
        run: echo "বিল্ড প্রক্রিয়া সম্পন্ন হয়েছে।"
        
